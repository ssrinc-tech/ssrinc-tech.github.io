<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868E96"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="330" rx="16" fill="#FFFFFF"/>

  <!-- 0. 시작할 때 도구 목록 확인 -->
  <path d="M365,90 V52 H635 V86" fill="none" stroke="#868E96" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <circle cx="393" cy="38" r="11" fill="#868E96"/>
  <text x="393" y="42.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="410" y="43" font-size="13.5" fill="#495057">시작할 때: "어떤 도구 있어?" → 날씨 도구 목록 받기</text>

  <!-- 상자 4개 -->
  <rect x="20" y="90" width="150" height="100" rx="14" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="2"/>
  <text x="95" y="134" font-size="18" font-weight="700" fill="#212529" text-anchor="middle">사용자</text>
  <text x="95" y="158" font-size="12.5" fill="#495057" text-anchor="middle">질문하는 사람</text>

  <rect x="290" y="90" width="150" height="100" rx="14" fill="#FFF4E6" stroke="#F59F00" stroke-width="2"/>
  <text x="365" y="134" font-size="18" font-weight="700" fill="#212529" text-anchor="middle">Claude Code</text>
  <text x="365" y="158" font-size="12.5" fill="#495057" text-anchor="middle">MCP 클라이언트</text>

  <rect x="560" y="90" width="150" height="100" rx="14" fill="#E7F5FF" stroke="#339AF0" stroke-width="2"/>
  <text x="635" y="134" font-size="18" font-weight="700" fill="#212529" text-anchor="middle">날씨 서버</text>
  <text x="635" y="158" font-size="12.5" fill="#495057" text-anchor="middle">MCP 서버 (이번에 만들 것)</text>

  <rect x="830" y="90" width="150" height="100" rx="14" fill="#EBFBEE" stroke="#51CF66" stroke-width="2"/>
  <text x="905" y="134" font-size="18" font-weight="700" fill="#212529" text-anchor="middle">기상청 API</text>
  <text x="905" y="158" font-size="12.5" fill="#495057" text-anchor="middle">외부 서비스</text>

  <!-- 요청 화살표 (위, 오른쪽 방향) -->
  <line x1="174" y1="122" x2="286" y2="122" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="444" y1="122" x2="556" y2="122" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="714" y1="122" x2="826" y2="122" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 응답 화살표 (아래, 왼쪽 방향) -->
  <line x1="286" y1="160" x2="174" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="556" y1="160" x2="444" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="826" y1="160" x2="714" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 요청 번호와 설명 -->
  <circle cx="230" cy="122" r="11" fill="#212529"/>
  <text x="230" y="126.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="230" y="105" font-size="13" fill="#212529" text-anchor="middle">질문</text>

  <circle cx="500" cy="122" r="11" fill="#212529"/>
  <text x="500" y="126.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="500" y="105" font-size="13" fill="#212529" text-anchor="middle">도구 실행 (서울)</text>

  <circle cx="770" cy="122" r="11" fill="#212529"/>
  <text x="770" y="126.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="770" y="105" font-size="13" fill="#212529" text-anchor="middle">날씨 요청</text>

  <!-- 응답 번호와 설명 -->
  <circle cx="230" cy="160" r="11" fill="#212529"/>
  <text x="230" y="164.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="230" y="186" font-size="13" fill="#212529" text-anchor="middle">답변</text>

  <circle cx="500" cy="160" r="11" fill="#212529"/>
  <text x="500" y="164.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="500" y="186" font-size="13" fill="#212529" text-anchor="middle">결과 문장</text>

  <circle cx="770" cy="160" r="11" fill="#212529"/>
  <text x="770" y="164.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="770" y="186" font-size="13" fill="#212529" text-anchor="middle">기온·습도</text>

  <!-- 2. Claude 판단 -->
  <line x1="365" y1="190" x2="365" y2="214" stroke="#F59F00" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="262" y="214" width="206" height="50" rx="10" fill="#FFF9DB" stroke="#F59F00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="282" cy="239" r="11" fill="#F59F00"/>
  <text x="282" y="243.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="234" font-size="13" fill="#212529">질문을 보고</text>
  <text x="300" y="253" font-size="13" fill="#212529">날씨 도구를 쓰기로 결정</text>

  <!-- 역할 요약 -->
  <text x="365" y="300" font-size="13.5" font-weight="700" fill="#E67700" text-anchor="middle">LLM: 도구 선택, 답변 작성</text>
  <text x="635" y="300" font-size="13.5" font-weight="700" fill="#1C7ED6" text-anchor="middle">서버: 실제 API 호출</text>
</svg>
